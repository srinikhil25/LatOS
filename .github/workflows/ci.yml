name: CI

# Every push, not just the long-lived branches. Work happens on `feat/**` and
# `fix/**` here, and restricting CI to main/develop meant a breakage could sit
# undetected until PR time — which is exactly what happened: the acquisition
# polish turned three benchmark tests red on a feature branch and nothing ran
# them for weeks.
on:
  push:
  pull_request:
    branches: [main]
  # The slow benchmark set is statistical and expensive, so it does not run on
  # every push (see the `test-slow` job). A weekly run means it is never more
  # than seven days since somebody checked.
  schedule:
    - cron: "0 3 * * 1" # Mondays, 03:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Linting & type checking (fast, runs first) ────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format check)
        run: ruff format --check .

      - name: MyPy (type check)
        run: mypy src/

  # ─── Unit + integration tests ──────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/core
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ml]"

      - name: Run tests (fast)
        run: |
          pytest -m "not ui and not gpu and not ollama and not slow" --cov --cov-report=xml --cov-report=term


      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: packages/core/coverage.xml
          fail_ci_if_error: false

  # ─── Coverage gate (ratchets up per stage) ─────────────────────────
  # Stage 0: 0 | Stage 1: 70 | Stage 4: 80 | Stage 8: 85
  coverage-gate:
    name: Coverage Gate
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: packages/core
    env:
      COVERAGE_MIN: "0"  # bump per stage
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Coverage check
        run: |
          pytest -m "not ui and not gpu and not ollama and not slow" \
            --cov \
            --cov-fail-under=${COVERAGE_MIN}

  # ─── Slow / statistical benchmark suite ────────────────────────────
  # Multi-seed campaign comparisons: ~10 minutes, and genuinely statistical, so
  # it does not belong on the six-way matrix that gates every push. It runs
  # where a red result gets seen — on main, on PRs into main, weekly, and on
  # demand. Every AX research claim rests on these tests, and three of them were
  # red for weeks precisely because nothing ran them.
  test-slow:
    name: Slow benchmark suite
    runs-on: ubuntu-latest
    needs: lint
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: packages/core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ml]"

      - name: Run slow tests
        run: pytest -m "slow" --no-cov -p no:cacheprovider

  # ─── Build artifacts (smoke test packaging) ────────────────────────
  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: packages/core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build hatchling

      - name: Build sdist + wheel
        run: python -m build

      - name: Check distributions
        run: |
          pip install twine
          twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: packages/core/dist/
          retention-days: 7
