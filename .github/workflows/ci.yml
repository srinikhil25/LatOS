name: CI

on:
  push:
    branches: [main, develop, "stage*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Linting & type checking (fast, runs first) ────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format check)
        run: ruff format --check .

      - name: MyPy (type check)
        run: mypy src/

  # ─── Unit + integration tests ──────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/core
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ml]"

      - name: Run tests (non-UI)
        run: |
          pytest -m "not ui and not gpu and not ollama" --cov --cov-report=xml --cov-report=term


      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: packages/core/coverage.xml
          fail_ci_if_error: false

  # ─── Coverage gate (ratchets up per stage) ─────────────────────────
  # Stage 0: 0 | Stage 1: 70 | Stage 4: 80 | Stage 8: 85
  coverage-gate:
    name: Coverage Gate
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: packages/core
    env:
      COVERAGE_MIN: "0"  # bump per stage
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Coverage check
        run: |
          pytest -m "not ui and not gpu and not ollama" \
            --cov \
            --cov-fail-under=${COVERAGE_MIN}

  # ─── Build artifacts (smoke test packaging) ────────────────────────
  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: packages/core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build hatchling

      - name: Build sdist + wheel
        run: python -m build

      - name: Check distributions
        run: |
          pip install twine
          twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: packages/core/dist/
          retention-days: 7
