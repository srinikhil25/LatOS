[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "latos"
version = "0.1.0"
description = "Latos — Multi-modal materials characterization desktop platform (Lattice + OS)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Srinikhil", email = "venkatasaivarma28@gmail.com" },
]
keywords = [
    "materials science",
    "characterization",
    "xrd",
    "xps",
    "thermoelectric",
    "spectroscopy",
    "bayesian optimization",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    # Core scientific stack
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "pyarrow>=15.0",

    # Data fitting
    "lmfit>=1.3",
    "pybaselines>=1.1",

    # File parsing
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "pillow>=10.0",
    "tifffile>=2024.1",

    # Publication figure export
    "matplotlib>=3.8",

    # Persistence
    "sqlalchemy>=2.0",
    "alembic>=1.13",

    # Materials science
    "pymatgen>=2024.3",
    "mp-api>=0.42",

    # Sample identification
    "rapidfuzz>=3.6",
    "networkx>=3.2",

    # Bayesian optimization (GP surrogate + acquisition). scikit-learn's
    # GaussianProcessRegressor is light and runs on a memory-tight box;
    # GPyTorch/BoTorch (the `ml` extra) are the GPU-scale production
    # target for the PhD, same GP method.
    "scikit-learn>=1.4",

    # NOTE: no UI dependencies — latos-core is headless. The desktop
    # app (apps/desktop, Tauri + React) consumes this package through
    # the `latos.server` sidecar. The retired Qt UI lives on the
    # `qt-ui-fallback` branch.

    # Configuration
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",

    # Logging & utilities
    "loguru>=0.7",
    "rich>=13.7",
    "tqdm>=4.66",
]

[project.optional-dependencies]
server = [
    # The desktop sidecar (apps/desktop spawns `python -m latos.server`)
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

ml = [
    # Stage 5: VLM/LLM (Ollama is external, just need HTTP client)
    "httpx>=0.27",

    # Stage 7: Bayesian Optimization
    "torch>=2.2",
    "gpytorch>=1.11",
    "botorch>=0.10",
]

dev = [
    # The sidecar (fastapi/uvicorn) is technically an optional extra, but the
    # test suite exercises `latos.server`, so development + CI need it here.
    "fastapi>=0.110",
    "uvicorn>=0.29",

    # Test runners.
    #
    # Floors are the versions this suite has actually been run green against,
    # and caps are the next major. The floors used to trail badly -- pytest said
    # >=8.0 while CI installed 9.1 -- so CI exercised a different major version
    # than any developer, and would have failed alone if it ever broke.
    #
    # Two of these can fail without any code changing. Hypothesis adds health
    # checks in minor releases, so a property test that passed can start failing
    # on timing or filtering alone; a cap at the major does not prevent that, and
    # nothing short of a lockfile would. httpx is the transport behind
    # fastapi.testclient and has broken TestClient compatibility across releases
    # before, which is why it is capped rather than left open like the other
    # runtime-ish helpers.
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1,<8",
    "httpx>=0.27,<1",  # fastapi.testclient transport
    "pytest-snapshot>=0.9,<1",
    "pytest-benchmark>=4.0,<6",
    "pytest-xdist>=3.8,<4",
    "hypothesis>=6.165.10,<7",

    # Code quality.
    #
    # Ruff is capped at a minor version on purpose. It was `>=0.3`, which let CI
    # install whatever had shipped that morning, and a rule graduating from
    # preview to stable (PLR0917, in 0.16) turned CI red with no code change and
    # no local reproduction, because the venv here was still on 0.15. A linter
    # that can fail spontaneously is worse than a slightly stale one; raise the
    # cap deliberately and fix what the new rules find in the same commit.
    "ruff>=0.16.4,<0.17",
    # Capped for the same reason, and the gap here was wider: this said `>=1.9`
    # while mypy had reached 2.x, so CI type-checked against a different major
    # version than any developer ran. It happened to pass, which is luck rather
    # than a policy. The floor is the version actually verified against this
    # code, so local and CI agree on something known to be clean.
    "mypy>=2.3.1,<3",
    "pre-commit>=4.6.2,<5",

    # Type stubs
    "pandas-stubs",
    "types-tqdm",
]

docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
]

build = [
    "pyinstaller>=6.5",
]

all = ["latos[server,ml,dev,docs,build]"]

[project.urls]
Homepage = "https://github.com/srinikhil25/LatOS"
Repository = "https://github.com/srinikhil25/LatOS"
Issues = "https://github.com/srinikhil25/LatOS/issues"

# ----------------------------------------------------------------------------
# Hatch packaging
# ----------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["src/latos"]

[tool.hatch.build.targets.wheel.force-include]
"src/latos/py.typed" = "latos/py.typed"

# ----------------------------------------------------------------------------
# Ruff (linter + formatter)
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

# Untracked local scratch scripts, already listed in .gitignore. They need to be
# named here as well because `ruff check` and `ruff format` disagree about
# .gitignore: the linter honours it, the formatter does not for paths handed to
# it explicitly, and `scripts/check.py` passes `scripts` explicitly. Without
# this the format gate fails on files that are not in the repository at all, so
# the check goes red locally while CI — which only ever sees tracked files —
# stays green. A gate that fails for a reason CI cannot reproduce is a gate
# people learn to ignore.
extend-exclude = [
    "scripts/architecture_diagram*.py",
    "scripts/dhivya_audit.py",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific
    "N",      # pep8-naming
    "D",      # pydocstyle
    "TID",    # flake8-tidy-imports
    "PL",     # pylint
]
ignore = [
    "D100",   # Missing docstring in public module
    "D104",   # Missing docstring in public package
    "D105",   # Missing docstring in magic method (dunder name communicates intent)
    "D107",   # Missing docstring in __init__ (covered by class docstring)
    "D203",   # 1 blank line required before class docstring
    "D213",   # Multi-line docstring summary should start at the second line
    "PLR0913",# Too many arguments in function definition
    "RUF002", # Ambiguous unicode char in docstring (we use Greek/math symbols: σ, α, η, …)
    "RUF003", # Ambiguous unicode char in comment (same rationale)
    "RUF022", # __all__ unsorted (we group by category for readability)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR2004", "PLC0415", "N818"]  # No docstrings + magic + local imports + test exception names
"scripts/**" = ["D"]
"migrations/versions/**" = ["D", "E501", "W291", "I001", "Q000"]  # auto-generated

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ----------------------------------------------------------------------------
# MyPy (type checker)
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_redundant_casts = true
warn_return_any = true
# src-layout: tell mypy where the package root is.
mypy_path = "src"
explicit_package_bases = true
# When a module name resolves to two paths (editable install + source),
# prefer the source tree.
namespace_packages = true

[[tool.mypy.overrides]]
module = [
    "lmfit.*",
    "pymatgen.*",
    "mp_api.*",
    "scipy.*",
    "sklearn.*",
    "xlrd.*",
    "openpyxl.*",
    "pyarrow.*",
    "networkx.*",
    "rapidfuzz.*",
    "pybaselines.*",
]
ignore_missing_imports = true

# tifffile ships with `py.typed`, so mypy follows its source — but its
# source uses Python 3.12 `type X = Y` statements that fail to parse
# under our 3.11 target. Skip imports of it entirely.
[[tool.mypy.overrides]]
module = ["tifffile", "tifffile.*"]
follow_imports = "skip"
ignore_missing_imports = true

# matplotlib ships `py.typed`; newer versions type rcParams as a dict keyed
# by a Literal of every valid key, so passing a plain `dict[str, object]` to
# `rc_context` fails [arg-type] on CI's fresh install (but not our pinned
# local one). We only use matplotlib for figure export, so skip its types.
[[tool.mypy.overrides]]
module = ["matplotlib", "matplotlib.*"]
follow_imports = "skip"
ignore_missing_imports = true

# ----------------------------------------------------------------------------
# pytest
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=latos",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: integration tests requiring full pipeline",
    "ui: retired marker (Qt-era); kept so CI '-m \"not ui\"' expressions stay valid",
    "gpu: tests requiring GPU/CUDA",
    "ollama: tests requiring local Ollama server",
]
filterwarnings = [
    "error",
    # Starlette 1.3.1+ TestClient emits a StarletteDeprecationWarning at import
    # time ("`httpx` … deprecated; install `httpx2`"). We pin httpx and it works
    # fine at runtime, so this third-party import-time warning must not fail
    # collection under `-W error`. (The class subclasses UserWarning, so only a
    # category/message filter matches it.)
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

# ----------------------------------------------------------------------------
# Coverage
# ----------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/latos"]
branch = true
omit = [
    "*/__init__.py",
]

[tool.coverage.report]
exclude_also = [
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]
# Coverage gate ratchets up per stage:
#   Stage 0: 0   (no app code yet — only smoke test)
#   Stage 1: 70  (foundation must be tested)
#   Stage 4: 80  (fit engine is critical)
#   Stage 8: 85  (production target)
fail_under = 0
show_missing = true
skip_covered = false
